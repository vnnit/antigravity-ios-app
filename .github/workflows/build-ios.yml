name: Build and Release iOS IPA

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.0.0)'
        required: false
        default: ''

jobs:
  build-ipa:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Determine App Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(node -p "require('./app.json').expo.version || '1.0.0'")
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Antigravity version: $VERSION"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate iOS Native Project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ./ios
        run: pod install

      - name: Build iOS Archive (Unsigned / Ad-Hoc for Sideloading)
        working-directory: ./ios
        run: |
          SCHEME="Antigravity"
          WORKSPACE="Antigravity.xcworkspace"
          
          # Build .app bundle
          xcodebuild clean build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA (Antigravity-v${{ steps.get_version.outputs.APP_VERSION }}.ipa)
        run: |
          VERSION="${{ steps.get_version.outputs.APP_VERSION }}"
          IPA_NAME="Antigravity-v${VERSION}.ipa"
          
          mkdir -p build_output/Payload
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found!"
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build_output/Payload/
          
          cd build_output
          zip -qr "../$IPA_NAME" Payload
          cd ..
          
          echo "Created $IPA_NAME successfully!"
          ls -la "$IPA_NAME"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-v${{ steps.get_version.outputs.APP_VERSION }}-ipa
          path: Antigravity-v${{ steps.get_version.outputs.APP_VERSION }}.ipa
          retention-days: 30

      - name: Create GitHub Release (on tag or manual version)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.get_version.outputs.APP_VERSION) }}
          name: Antigravity v${{ steps.get_version.outputs.APP_VERSION }}
          draft: false
          prerelease: false
          files: Antigravity-v${{ steps.get_version.outputs.APP_VERSION }}.ipa
          generate_release_notes: true
