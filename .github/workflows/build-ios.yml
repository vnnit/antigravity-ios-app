name: Build and Release iOS IPA

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.0.0)'
        required: false
        default: ''

jobs:
  build-ios:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Setup Ruby and CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          node scripts/patch-expo.js

      - name: Determine App Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(node -p "require('./app.json').expo.version || '1.0.0'")
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Antigravity version: $VERSION"

      - name: Generate iOS Native Project (Expo Prebuild)
        run: |
          export NODE_BINARY=$(which node)
          echo "export NODE_BINARY=$(which node)" > .xcode.env.local
          npx expo prebuild --platform ios --clean --no-install
          mkdir -p ios
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

      - name: Install CocoaPods
        run: |
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          export PATH="$(dirname $(which node)):/usr/local/bin:/opt/homebrew/bin:$PATH"
          export NODE_BINARY=$(which node)
          
          cd ios
          bundle exec pod install --verbose || pod install --repo-update --verbose

      - name: Build iOS Application (.app Release)
        run: |
          export PATH="$(dirname $(which node)):/usr/local/bin:/opt/homebrew/bin:$PATH"
          export NODE_BINARY=$(which node)
          
          xcodebuild build \
            -workspace ios/Antigravity.xcworkspace \
            -scheme Antigravity \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package & Sign IPA (Antigravity-v${{ steps.get_version.outputs.APP_VERSION }}.ipa)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          VERSION="${{ steps.get_version.outputs.APP_VERSION }}"
          IPA_NAME="Antigravity-v${VERSION}.ipa"
          
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: .app file not found in ios/build/Build/Products/Release-iphoneos!"
            exit 1
          fi
          
          echo "Found compiled app at: $APP_PATH"

          # Install zsign
          brew install zsign

          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "Certificate secrets detected! Signing with custom certificate and profile..."
            
            CERT_PATH=$RUNNER_TEMP/cert.p12
            PP_PATH=$RUNNER_TEMP/profile.mobileprovision
            
            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
            
            PASSWORD="${P12_PASSWORD:-1}"
            zsign -k "$CERT_PATH" -p "$PASSWORD" -m "$PP_PATH" -o "$IPA_NAME" "$APP_PATH"
            echo "✅ Signed IPA generated successfully!"
          else
            echo "No certificate secrets configured. Generating unsigned IPA..."
            mkdir -p package_dir/Payload
            cp -R "$APP_PATH" package_dir/Payload/
            cd package_dir
            zip -qr "../$IPA_NAME" Payload
            cd ..
            echo "✅ Unsigned IPA generated successfully!"
          fi
          
          echo "Output IPA: $IPA_NAME ($(du -h "$IPA_NAME" | cut -f1))"
          ls -lh "$IPA_NAME"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-v${{ steps.get_version.outputs.APP_VERSION }}-ipa
          path: Antigravity-v${{ steps.get_version.outputs.APP_VERSION }}.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.get_version.outputs.APP_VERSION) }}
          name: Antigravity v${{ steps.get_version.outputs.APP_VERSION }}
          draft: false
          prerelease: false
          files: Antigravity-v${{ steps.get_version.outputs.APP_VERSION }}.ipa
          generate_release_notes: true
